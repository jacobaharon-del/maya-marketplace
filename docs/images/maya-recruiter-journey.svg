<svg width="680" height="530" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Maya recruiter usage journey</title>
<desc>Six-step flow for a recruiter using Maya: install once, trigger Maya in chat, answer her intake questions, sign off on the brief, Maya searches and screens autonomously, then the recruiter reviews their pipeline.</desc>
<rect width="680" height="530" fill="#ffffff"/>
<rect x="160" y="40" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Install once</text>
<text x="340" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">two commands, one time</text>

<line x1="340" y1="90" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="120" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Trigger Maya in chat</text>
<text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">say what you need sourced</text>

<line x1="340" y1="170" x2="340" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="200" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="221" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Answer her questions</text>
<text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">one at a time, in chat</text>

<line x1="340" y1="250" x2="340" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="280" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="301" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sign off on the brief</text>
<text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">one explicit yes</text>

<line x1="340" y1="330" x2="340" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="360" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="381" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Maya searches and screens</text>
<text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">she drives linkedin, not you</text>

<line x1="340" y1="410" x2="340" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="440" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="461" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Review your pipeline</text>
<text x="340" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">save / maybe / parked / hide</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#5F5E5A"/>
</marker>
</defs>
</svg>
